name: Shopify theme

# Auto-deploys this theme to Shopify.
#  - On every PR to main: lint the theme (Theme Check). No deploy.
#  - On every push to main: lint, then push the theme to the store.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SHOPIFY_FLAG_STORE        your-store.myshopify.com
#   SHOPIFY_CLI_THEME_TOKEN   a Theme Access password (see notes at bottom)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: shopify-theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Theme check (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Shopify CLI
        # Pinned for reproducible CI (theme check verified on this version).
        # Bump deliberately and re-run `shopify theme check` locally first.
        run: npm install -g @shopify/cli@3.94.3
      - name: Run Theme Check
        # Only fail the build on real errors, not warnings/suggestions.
        run: shopify theme check --fail-level error

  deploy:
    name: Deploy to Shopify
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Shopify CLI
        # Pinned for reproducible CI (theme check verified on this version).
        # Bump deliberately and re-run `shopify theme check` locally first.
        run: npm install -g @shopify/cli@3.94.3
      - name: Push theme to Shopify
        env:
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        # --live --allow-live pushes to the PUBLISHED theme without a prompt.
        #
        # Content is owned by the Theme Editor, not code. We --ignore the files a
        # merchant edits in the admin so deploys never clobber their work:
        #   config/settings_data.json   - theme settings (colors/fonts/app keys)
        #   templates/*.json            - page content/layout (home, product, pages…)
        #   templates/customers/*.json  - account page content
        #   sections/*.json             - header/footer/aside group content
        # Those edits flow back into git via .github/workflows/sync-content.yml.
        # Everything else (sections/*.liquid, snippets, assets, locales) is code:
        # code wins and deploys normally.
        #
        # NOTE: the glob patterns are single-quoted so the SHELL doesn't expand
        # them — the Shopify CLI must receive the literal pattern.
        #
        # To intentionally ship a content change FROM git, pull first then push
        # only that file:
        #   shopify theme pull --live                     # get the editor's latest
        #   shopify theme push --live --allow-live --only templates/index.json
        #
        # SAFER ALTERNATIVE: push to a dedicated, unpublished theme instead of
        # live, by replacing "--live --allow-live" with "--theme <THEME_ID>".
        # Find IDs with: shopify theme list
        run: |
          shopify theme push \
            --live --allow-live \
            --ignore config/settings_data.json \
            --ignore 'templates/*.json' \
            --ignore 'templates/customers/*.json' \
            --ignore 'sections/*.json' \
            --json
